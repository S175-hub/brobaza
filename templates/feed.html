{% extends "base.html" %}

{% block content %}

<style>
    :root {
        --primary: {{ THEME.primary }};
        --primary-soft: {{ THEME.primary_soft }};
        --text: {{ THEME.text }};
        --text-soft: {{ THEME.text_soft }};
        --like: {{ THEME.like }};
        --like-soft: {{ THEME.like_soft }};
        --delete: {{ THEME.delete }};
        --delete-soft: {{ THEME.delete_soft }};
        --bg: {{ THEME.bg }};
        --card-border: {{ THEME.card_border }};
        --card-hover: {{ THEME.card_hover }};
        --errors: {{ THEME.errors }};
    }

    body {
        background-color: var(--bg);
    }

    .feed-layout {
        max-width: 600px;
        margin: 0 auto;
    }

    .feed-card {
        position: relative;
    }

    .feed-card-link {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        color: inherit;
    }

    .feed-card-author a,
    .feed-menu-wrap,
    .feed-like {
        position: relative;
        z-index: 2;
    }

    .feed-card {
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 20px;
        background-color: var(--bg);
        transition: background-color 200ms ease;
    }

    .feed-card:hover {
        background-color: var(--card-hover);
    }

    .feed-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .feed-card-author {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .feed-card-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
    }

    .feed-card-nickname {
        text-decoration: none;
        color: var(--text);
        transition: color 200ms ease;
    }

    .feed-card-nickname:hover {
        color: var(--primary);
        text-decoration: none;
    }

    .feed-card-date {
        font-size: 12px;
        color: var(--text-soft);
    }

    .feed-menu-wrap {
        position: relative;
    }

    .feed-menu-btn {
        border: none;
        background: none;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        color: var(--text-soft);
        padding: 6px 10px;
        border-radius: 8px;
        transition: background-color 200ms ease, color 200ms ease;
        outline: none;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
    }

    .feed-menu-btn:hover {
        color: var(--primary);
        background-color: var(--primary-soft);
    }

    .feed-menu-btn:focus,
    .feed-menu-btn:focus-visible,
    .feed-menu-btn:active {
        outline: none;
        box-shadow: none;
        color: var(--primary);
        background-color: var(--primary-soft);
    }

    .feed-menu-dropdown {
        display: none;
        position: absolute;
        right: 0;
        top: 34px;
        background-color: var(--bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        min-width: 160px;
        z-index: 100;
        overflow: hidden;
    }

    .feed-menu-edit {
        display: block;
        padding: 10px 14px;
        color: var(--text) !important;
        text-decoration: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        font-weight: 500;
        transition: background-color 200ms ease, color 200ms ease;
    }

    .feed-menu-edit:visited {
        color: var(--text) !important;
    }

    .feed-menu-edit:hover,
    .feed-menu-edit:active,
    .feed-menu-edit:focus,
    .feed-menu-edit:focus-visible {
        background-color: var(--primary-soft);
        color: var(--primary) !important;
        text-decoration: none;
        outline: none;
        box-shadow: none;
    }

    .feed-menu-delete {
        display: block;
        padding: 10px 14px;
        color: var(--delete) !important;
        text-decoration: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        font-weight: 500;
        transition: background-color 200ms ease, color 200ms ease;
    }

    .feed-menu-delete:visited {
        color: var(--delete) !important;
    }

    .feed-menu-delete:hover,
    .feed-menu-delete:active,
    .feed-menu-delete:focus,
    .feed-menu-delete:focus-visible {
        background-color: var(--delete-soft);
        color: var(--delete) !important;
        text-decoration: none;
        outline: none;
        box-shadow: none;
    }

    .feed-card-text {
        margin-top: 10px;
        margin-bottom: 10px;
        color: var(--text);
    }

    .feed-card-image {
        width: 100%;
        border-radius: 10px;
        margin-top: 10px;
    }

    .feed-like {
        text-decoration: none !important;
        font-size: 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        margin-left: -8px;
        margin-top: 10px;
        border-radius: 999px;
        border: none;
        background: none;
        color: var(--text-soft) !important;
        transition: background-color 200ms ease, color 200ms ease;
        cursor: pointer;
        outline: none;
        box-shadow: none;
    }

    .feed-like:visited {
        color: var(--text-soft) !important;
    }

    .feed-like i {
        font-size: 18px;
        line-height: 1;
        transition: color 200ms ease, transform 150ms ease;
    }

    .feed-like-count {
        color: var(--text-soft) !important;
        font-size: 14px;
        transition: color 200ms ease;
        line-height: 1;
    }

    .feed-like:hover {
        background-color: var(--like-soft);
        text-decoration: none !important;
        color: var(--like) !important;
    }

    .feed-like:hover .feed-like-count {
        color: var(--like) !important;
    }

    .feed-like:focus,
    .feed-like:focus-visible,
    .feed-like:active {
        outline: none;
        box-shadow: none;
        background-color: var(--like-soft);
        color: var(--like) !important;
    }

    .feed-like:focus .feed-like-count,
    .feed-like:focus-visible .feed-like-count,
    .feed-like:active .feed-like-count {
        color: var(--like) !important;
    }

    .feed-like.is-liked {
        color: var(--like) !important;
    }

    .feed-like.is-liked .feed-like-count {
        color: var(--like) !important;
    }

    .feed-like.is-liked:hover,
    .feed-like.is-liked:focus,
    .feed-like.is-liked:active {
        background-color: var(--like-soft);
        color: var(--like) !important;
    }

    .feed-like.is-liked:hover .feed-like-count,
    .feed-like.is-liked:focus .feed-like-count,
    .feed-like.is-liked:active .feed-like-count {
        color: var(--like) !important;
    }

    .feed-empty {
        text-align: center;
        color: var(--text-soft);
    }
</style>

<div class="feed-layout">

    {% include "add_post.html" %}

    {% for post in posts %}
        {% include "post_card.html" %}
    {% else %}
        <p class="feed-empty">Постов пока нет</p>
    {% endfor %}

</div>

<script>
    function toggleMenu(e, id) {
        e.stopPropagation();

        const menu = document.getElementById("menu-" + id);

        if (!menu) return;

        menu.style.display =
            menu.style.display === "block"
                ? "none"
                : "block";
    }

    document.addEventListener("click", function (e) {
        document.querySelectorAll("[id^='menu-']").forEach(menu => {
            menu.style.display = "none";
        });
    });
</script>

{% endblock %}
