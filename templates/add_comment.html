<style>
    .comment-create {
        border: 1px solid var(--card-border);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
        margin-top: 20px;
        background-color: var(--bg);
    }

    .comment-create-input {
        display: flex;
        gap: 12px;
        align-items: flex-start;
    }

    .comment-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
    }

    .comment-textarea {
        flex: 1;
        border: 1px solid var(--card-border);
        outline: none;
        resize: none;
        border-radius: 10px;
        padding: 12px 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        color: var(--text);
        background-color: var(--bg);
        box-sizing: border-box;
        transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    .comment-textarea::placeholder {
        color: var(--text-soft);
    }

    .comment-textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .comment-create-actions {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .comment-create-left-actions {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .icon-action-btn {
        border: none;
        background: none;
        font-size: 20px;
        cursor: pointer;
        color: var(--text-soft);
        padding: 6px 8px;
        border-radius: 8px;
        transition: background-color 200ms ease, color 200ms ease;
        line-height: 1;
        outline: none;
        box-shadow: none;
    }

    .icon-action-btn:hover {
        background-color: var(--primary-soft);
        color: var(--primary);
    }

    .feed-create-file {
        display: none;
    }

    .comment-submit-btn {
        border: none;
        background-color: var(--primary);
        color: var(--bg);
        padding: 6px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        font-weight: 600;
        transition: background-color 200ms ease, transform 120ms ease, box-shadow 200ms ease;
        box-shadow: none;
        outline: none;
    }

    .comment-submit-btn:hover {
        background-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .comment-submit-btn:active {
        transform: scale(0.97);
    }

    .comment-image-preview-container {
        display: none;
        position: relative;
        margin-top: 12px;
        margin-left: 52px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--card-border);
    }

    .comment-image-preview-container img {
        width: 100%;
        display: block;
    }

    .comment-image-preview-remove {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background-color: color-mix(in srgb, var(--bg) 70%, transparent);
        backdrop-filter: blur(8px);
        color: var(--text-soft);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 200ms ease, color 200ms ease;
        line-height: 1;
        outline: none;
        box-shadow: none;
    }

    .comment-image-preview-remove:hover {
        background-color: var(--primary-soft);
        color: var(--text);
    }

    .comment-emoji-picker {
        display: none;
        margin-top: 10px;
        margin-bottom: 10px;
        margin-left: 52px;
        background-color: var(--bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 4px 12px var(--card-border);
        flex-wrap: wrap;
        gap: 2px;
        max-height: 250px;
        overflow-y: auto;
    }

    .comment-emoji-item {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        font-size: 20px;
        cursor: pointer;
        border-radius: 8px;
        transition: background-color 150ms ease;
        border: none;
        background: none;
        padding: 0;
    }

    .comment-emoji-item:hover {
        background-color: var(--primary-soft);
    }
</style>

<form action="{{ url_for('comment.add_comment', post_id=request.view_args.post_id) }}"
      method="POST"
      enctype="multipart/form-data"
      class="comment-create">

    {{ form.hidden_tag() }}
    <input type="hidden" name="next" value="{{ request.path }}">

    <div class="comment-create-input">
        <img src="{{ url_for('static', filename=current_user.avatar if current_user.is_authenticated else 'avatars/default.jpg') }}" class="comment-avatar">
        {{ form.text(class="comment-textarea", id="commentTextArea", placeholder="Что думаешь?", rows="1") }}
    </div>

    <div id="commentImagePreviewContainer" class="comment-image-preview-container">
        <img id="commentImagePreview" src="" alt="">
        <button type="button" class="comment-image-preview-remove" onclick="clearCommentImagePreview()">✕</button>
    </div>

    <div id="commentEmojiPicker" class="comment-emoji-picker">
        {% for emoji in EMOJI_LIST %}
        <button type="button" class="comment-emoji-item" onclick="insertCommentEmoji(`{{ emoji }}`)">{{ emoji }}</button>
        {% endfor %}
    </div>

    <div class="comment-create-actions">
        <div class="comment-create-left-actions">
            <input type="file" id="commentImageInput" name="image" class="feed-create-file" accept=".jpeg, .jpg, .png">
            <button type="button" class="icon-action-btn" onclick="document.getElementById('commentImageInput').click()">
                <i class="bi bi-card-image"></i>
            </button>
            <button type="button" class="icon-action-btn" onclick="toggleCommentEmojiPicker()" title="Смайлики">
                <i class="bi bi-emoji-smile"></i>
            </button>
        </div>
        {{ form.submit(class="comment-submit-btn") }}
    </div>
</form>

<script>
    function toggleCommentEmojiPicker() {
        const picker = document.getElementById('commentEmojiPicker');
        picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
    }

    function insertCommentEmoji(emoji) {
        const textarea = document.getElementById('commentTextArea');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;

        textarea.value = text.substring(0, start) + emoji + text.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + emoji.length;
        textarea.focus();

        document.getElementById('commentEmojiPicker').style.display = 'none';
    }

    document.getElementById('commentImageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const previewContainer = document.getElementById('commentImagePreviewContainer');
        const previewImg = document.getElementById('commentImagePreview');

        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'block';
            }
            reader.readAsDataURL(file);
        } else {
            clearCommentImagePreview();
        }
    });

    function clearCommentImagePreview() {
        const input = document.getElementById('commentImageInput');
        const previewContainer = document.getElementById('commentImagePreviewContainer');
        const previewImg = document.getElementById('commentImagePreview');

        input.value = '';
        previewImg.src = '';
        previewContainer.style.display = 'none';
    }

    document.addEventListener('click', function (e) {
        const picker = document.getElementById('commentEmojiPicker');
        const btn = e.target.closest('.icon-action-btn');
        if (picker && !picker.contains(e.target) && !(btn && btn.getAttribute('title') === 'Смайлики')) {
            picker.style.display = 'none';
        }
    });
</script>
