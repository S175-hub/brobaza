<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Brobaza</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>{{ title }}</title>

    <script>
        if (sessionStorage.getItem('isBackNav') === 'true') {
            document.documentElement.style.visibility = 'hidden';
        }
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
    </script>

    <style>
        :root {
            --primary: {{ THEME.primary }};
            --primary-soft: {{ THEME.primary_soft }};
            --text: {{ THEME.text }};
            --text-soft: {{ THEME.text_soft }};
            --like: {{ THEME.like }};
            --like-soft: {{ THEME.like_soft }};
            --delete: {{ THEME.delete }};
            --delete-soft: {{ THEME.delete_soft }};
            --bg: {{ THEME.bg }};
            --card-border: {{ THEME.card_border }};
            --card-hover: {{ THEME.card_hover }};
            --errors: {{ THEME.errors }};
        }

        body {
            background-color: var(--bg);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
        }

        *:focus {
            outline: none;
        }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--primary-soft);
            outline-offset: 2px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1050;

            background-color: color-mix(in srgb, var(--bg) 78%, transparent) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid var(--card-border);
            padding: 0 24px;
            height: 75px;
            box-shadow: none;

            display: flex;
            align-items: center;
        }

        .navbar-brand {
            color: var(--primary) !important;
            font-size: 1.6rem !important;
            font-weight: 700 !important;
            letter-spacing: -0.3px;
            text-decoration: none !important;
            transition: none !important;
            display: flex;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .navbar-brand:hover,
        .navbar-brand:active,
        .navbar-brand:focus {
            color: var(--primary) !important;
            text-decoration: none !important;
        }

        .navbar-brand img {
            height: 80px;
            max-height: 100%;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .app-layout {
            max-width: 600px;
            margin: 88px auto 0 auto;
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 40px;
            box-sizing: border-box;
        }

        .main-content {
            width: 100%;
            max-width: 600px;
            min-width: 0;
        }

        .nav-pill-btn {
            text-decoration: none !important;
            color: var(--text) !important;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 999px;
            border: 1.5px solid var(--card-border);
            background-color: color-mix(in srgb, var(--bg) 50%, transparent);
            display: inline-flex;
            align-items: center;
            transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
        }

        .nav-pill-btn:hover {
            background-color: var(--primary-soft);
            border-color: var(--primary-soft);
            color: var(--primary) !important;
            text-decoration: none !important;
        }

        .nav-pill-btn:active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: var(--bg) !important;
        }

        .nav-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            border: 1px solid var(--card-border);
        }

        .dropdown-toggle::after {
            border-top-color: var(--text-soft) !important;
            margin-left: 8px;
        }

        .nav-pill-btn:hover .dropdown-toggle::after,
        .nav-pill-btn:hover::after {
            border-top-color: var(--primary) !important;
        }

        .dropdown-menu {
            background-color: var(--bg) !important;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;

            border: 1px solid var(--card-border) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05) !important;
            padding: 8px !important;
            min-width: 160px;
            margin-top: 8px !important;
        }

        .dropdown-item {
            border-radius: 8px;
            color: var(--text) !important;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 12px !important;
            transition: background-color 200ms ease, color 200ms ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background-color: var(--primary-soft) !important;
            color: var(--primary) !important;
        }

        .dropdown-item-danger:hover,
        .dropdown-item-danger:focus {
            background-color: var(--delete-soft) !important;
            color: var(--delete) !important;
        }

        .dropdown-divider {
            border-top: 1px solid var(--card-border) !important;
            margin: 6px 0 !important;
        }

        .theme-toggle-btn-guest {
            text-decoration: none !important;
            color: var(--text) !important;
            font-size: 18px;
            padding: 8px 10px;
            border-radius: 999px;
            border: none !important;
            background-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 200ms ease, color 200ms ease;
            margin-right: 10px;
        }

        .theme-toggle-btn-guest:hover,
        .theme-toggle-btn-guest:focus,
        .theme-toggle-btn-guest:active {
            background-color: var(--primary-soft);
            color: var(--primary) !important;
            text-decoration: none !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }

        @media (max-width: 992px) {
            .app-layout {
                margin-left: 0;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
<header>
    <nav class="navbar navbar-expand justify-content-between">

        <a class="navbar-brand" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='img/' + THEME_NAME + '/logo.png') }}"
                 alt="Логотип"
                 class="theme-dependent-img"
                 data-img-name="logo.png">
        </a>

        <div class="d-flex align-items-center">
            {% if current_user.is_authenticated %}
            <div class="dropdown">
                <a class="nav-pill-btn dropdown-toggle d-flex align-items-center"
                   href="#"
                   id="profileDropdown"
                   role="button"
                   data-toggle="dropdown"
                   aria-haspopup="true"
                   aria-expanded="false"
                   style="padding: 4px 12px 4px 4px;">

                    <img src="{{ url_for('static', filename=current_user.avatar) }}"
                         class="nav-avatar">

                    <span>
                        {{ current_user.nickname }}
                    </span>
                </a>

                <div class="dropdown-menu dropdown-menu-right"
                     aria-labelledby="profileDropdown">

                    <a class="dropdown-item" href="{{ url_for('profile.profile') }}">
                        <i class="bi bi-person"></i> Профиль
                    </a>

                    <a class="dropdown-item" href="#" onclick="switchTheme(event)" id="theme-toggle-btn">
                        {% if THEME_NAME == 'light' %}
                        <i class="bi bi-sun"></i> Светлая
                        {% else %}
                        <i class="bi bi-moon"></i> Тёмная
                        {% endif %}
                    </a>

                    <div class="dropdown-divider"></div>

                    <a class="dropdown-item dropdown-item-danger" href="{{ url_for('login.logout') }}">
                        Выйти
                    </a>
                </div>
            </div>

            {% else %}

            <button type="button" onclick="switchTheme(event)" id="guest-theme-toggle-btn"
                    class="theme-toggle-btn-guest" title="Сменить тему">
                {% if THEME_NAME == 'light' %}
                <i class="bi bi-sun"></i>
                {% else %}
                <i class="bi bi-moon"></i>
                {% endif %}
            </button>

            <a class="nav-pill-btn" href="{{ url_for('login.login') }}">
                Войти
            </a>

            <a class="nav-pill-btn" href="{{ url_for('register.register') }}" style="margin-left: 10px;">
                Регистрация
            </a>

            {% endif %}

        </div>

    </nav>
</header>

<main class="app-layout">
    {% include 'sidebar.html' %}

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

<script>
    function likePost(postId, el) {
        fetch(`/like/${postId}`)
            .then(res => res.json())
            .then(data => {
                const icon = el.querySelector('i');
                const countSpan = el.querySelector('.feed-like-count');

                if (data.liked) {
                    icon.classList.remove('bi-heart');
                    icon.classList.add('bi-heart-fill');
                    el.classList.add('is-liked');
                } else {
                    icon.classList.remove('bi-heart-fill');
                    icon.classList.add('bi-heart');
                    el.classList.remove('is-liked');
                }

                if (countSpan) {
                    countSpan.innerText = data.count;
                }
            })
            .catch(err => console.log(err));
    }

    function switchTheme(event) {
        if (event) event.preventDefault();

        fetch('{{ url_for("settings.set_theme") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(data => {
            if (data.variables) {
                const root = document.documentElement;
                for (const [key, value] of Object.entries(data.variables)) {
                    const cssVarName = '--' + key.replace(/_/g, '-');
                    root.style.setProperty(cssVarName, value);
                }

                const themeBtn = document.getElementById('theme-toggle-btn');
                if (themeBtn) {
                    if (data.theme_name === 'light') {
                        themeBtn.innerHTML = '<i class="bi bi-sun"></i> Светлая';
                    } else {
                        themeBtn.innerHTML = '<i class="bi bi-moon"></i> Тёмная';
                    }
                }

                const guestThemeBtn = document.getElementById('guest-theme-toggle-btn');
                if (guestThemeBtn) {
                    if (data.theme_name === 'light') {
                        guestThemeBtn.innerHTML = '<i class="bi bi-sun"></i>';
                    } else {
                        guestThemeBtn.innerHTML = '<i class="bi bi-moon"></i>';
                    }
                }

                const images = document.querySelectorAll('.theme-dependent-img');
                images.forEach(img => {
                    const imgName = img.getAttribute('data-img-name');
                    if (imgName) {
                        const newSrc = `/static/img/${data.theme_name}/${imgName}`;
                        img.src = newSrc;
                    }
                });
            }
        })
        .catch(err => console.log('Ошибка смены темы:', err));
    }

    document.addEventListener('DOMContentLoaded', function() {

        if (sessionStorage.getItem('isBackNav') === 'true') {
            sessionStorage.removeItem('isBackNav');
            const savedScroll = sessionStorage.getItem('scrollPos_' + window.location.pathname);
            if (savedScroll) {
                window.scrollTo(0, parseInt(savedScroll, 10));
            }
            document.documentElement.style.visibility = 'visible';
        }

        document.body.addEventListener('click', function(e) {
            const link = e.target.closest('a');

            if (!link) return;

            if (link.target && link.target !== '_self') return;
            if (link.getAttribute('href') === '#') return;
            if (link.hostname !== window.location.hostname) return;
            if (link.hasAttribute('data-toggle')) return;
            if (link.id === 'theme-toggle-btn') return;
            if (link.classList.contains('dropdown-item-danger')) return;

            e.preventDefault();

            const url = link.href;
            const mainContent = document.querySelector('.main-content');

            if (window.location.href === url) return;

            sessionStorage.setItem('scrollPos_' + window.location.pathname, window.scrollY.toString());

            mainContent.style.opacity = '0.5';
            mainContent.style.transition = 'opacity 150ms ease';

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Ошибка сети');
                    const finalUrl = response.url;
                    return response.text().then(html => ({html: html, finalUrl: finalUrl}));
                })
                .then(({html, finalUrl}) => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const newContent = doc.querySelector('.main-content');

                    if (!newContent) {
                        window.location.href = finalUrl;
                        return;
                    }

                    mainContent.innerHTML = newContent.innerHTML;

                    const scripts = newContent.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        for (const attr of oldScript.attributes) {
                            newScript.setAttribute(attr.name, attr.value);
                        }
                        mainContent.appendChild(newScript);
                        oldScript.remove();
                    });

                    document.title = doc.title;
                    window.history.pushState({}, '', finalUrl);

                    mainContent.style.opacity = '1';
                    window.scrollTo(0, 0);
                })
                .catch(err => {
                    console.error('Ошибка загрузки страницы:', err);
                    window.location.href = url;
                });
        });

        window.addEventListener('popstate', function() {
            sessionStorage.setItem('isBackNav', 'true');
            location.reload();
        });
    });
</script>

</body>
</html>
